<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${jobApplication.id != null} ? 'Edit Application' : 'New Application'">Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">
</head>
<body style="background-color: slate-gray">
<div class="container-sm my-4">
    <h1 th:text="${jobApplication.id != null} ? 'Edit Job Application' : 'New Job Application'">New Job Application</h1>

    <form th:action="@{/save}" th:object="${jobApplication}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}"/>

        <!-- Company -->
        <div class="form-floating mb-3">
            <input class="form-control" id="floatingCompany" th:field="*{companyName}" placeholder="Company Name" required/>
            <label for="floatingCompany">Company</label>
        </div>

        <!-- Position -->
        <div class="form-floating mb-3">
            <input class="form-control" id="floatingPosition" th:field="*{position}" placeholder="Position" required/>
            <label for="floatingPosition">Position</label>
        </div>

        <!-- Status -->
        <div class="form-floating mb-3">
            <select class="form-select" id="floatingStatus" th:field="*{status}" required>
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}"></option>
            </select>
            <label for="floatingStatus">Status</label>
        </div>

        <!-- Applied Date -->
        <div class="form-floating mb-3">
            <input class="form-control" id="floatingDate" th:field="*{appliedDate}" type="date" required/>
            <label for="floatingDate">Date</label>
            <script>
                if (!document.getElementById('floatingDate').value) {
                    document.getElementById('floatingDate').valueAsDate = new Date();
                }
            </script>
        </div>

        <!-- Notes -->
        <div class="form-floating mb-3">
            <textarea class="form-control" id="floatingNotes" th:field="*{notes}" placeholder="Notes"></textarea>
            <label for="floatingNotes">Notes</label>
        </div>

        <!-- Existing Images -->
        <div class="mb-3" th:if="${jobApplication.advertImageFilenames != null and !#lists.isEmpty(jobApplication.advertImageFilenames)}">
            <label class="form-label">Existing Screenshots</label>
            <div class="d-flex flex-wrap gap-2">
                <div th:each="filename : ${jobApplication.advertImageFilenames}" class="position-relative">
                    <img th:src="@{'/uploads/' + ${filename}}" class="img-thumbnail" style="height:100px; width:auto;" />
                    <button type="button" class="btn-close position-absolute top-0 end-0"
                            aria-label="Remove"
                            th:data-filename="${filename}"
                            onclick="removeImage(this.dataset.filename)"></button>
                </div>
            </div>
        </div>

        <!-- Upload New Images -->
        <div class="mb-3">
            <label for="advertImages" class="form-label">Upload New Screenshots</label>
            <input class="form-control" type="file" id="advertImages" name="advertImages" accept="image/*" multiple>
            <small class="text-muted">You can select multiple files.</small>
        </div>

        <!-- Save Button -->
        <div class="form-floating mb-3 d-grid gap-2">
            <button class="btn btn-success" type="submit">Save</button>
        </div>
    </form>
</div>

<script>
    function removeImage(filename) {
        // Remove the image element from the form
        const imgDiv = event.target.parentElement;
        imgDiv.remove();

        // Add a hidden input so backend knows to remove it
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'removeImages';
        input.value = filename;
        document.querySelector('form').appendChild(input);
    }
</script>
</body>
</html>
